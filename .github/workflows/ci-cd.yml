name: CI/CD - Reconocimiento de Emociones

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: 1. Compilacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/

test:
  name: 2. Pruebas automatizadas
  needs: build
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci  # Use npm ci instead of npm install
    - name: Ejecutar pruebas unitarias (Jest)
      run: npm test -- --ci --coverage
    - name: Auditoria de seguridad de dependencias
      run: npm audit --audit-level=high || true

  deploy:
    name: 3. Despliegue simulado
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/
      - name: Simular despliegue a staging
        run: |
          mkdir -p staging
          cp -r dist/* staging/
          echo "Despliegue exitoso (simulado) - $(date)"
          ls -la staging/